<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1260" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-hit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-miss" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#3b82f6"/>
    </marker>

    <!-- 渐变 -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="net-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- 顶部标题横幅 -->
  <g transform="translate(40, 36)">
    <rect width="840" height="74" rx="16" fill="url(#primary-grad)" filter="url(#shadow)"/>
    <text x="32" y="36" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="0.5">Glide 缓存逐级检索决策流程</text>
    <text x="32" y="58" fill="#dbeafe" font-size="12" font-weight="400">Engine.load() 核心分发逻辑 · 动静互斥 · 尺寸复用 · 网络回退完整流程</text>
    
    <!-- 状态指示胶囊 -->
    <rect x="670" y="24" width="138" height="26" rx="13" fill="#1d4ed8" />
    <circle cx="684" cy="37" r="4" fill="#60a5fa" />
    <text x="696" y="41" fill="#eff6ff" font-size="11" font-weight="600">ENGINE PIPELINE</text>
  </g>

  <!-- 起始触发节点 -->
  <g transform="translate(190, 134)">
    <rect width="440" height="52" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="220" y="27" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">发起图片请求：Engine.load(key)</text>
    <text x="220" y="44" text-anchor="middle" fill="#64748b" font-size="11">计算生成唯一键 EngineKey (Model, Width, Height, Transformations...)</text>
  </g>

  <!-- 连线：请求 -> 第1级 -->
  <path d="M 410 186 L 410 226" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- ================= 第一级：ActiveResources ================= -->
  <g transform="translate(40, 228)">
    <!-- 主决策卡片 -->
    <rect width="490" height="132" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="132" rx="4" fill="#3b82f6"/>
    
    <!-- 序号圆圈 -->
    <circle cx="36" cy="36" r="16" fill="#eff6ff"/>
    <text x="36" y="42" text-anchor="middle" fill="#2563eb" font-size="15" font-weight="700">1</text>
    
    <text x="64" y="32" fill="#0f172a" font-size="15" font-weight="700">检查 ActiveResources (活动资源 · 弱引用)</text>
    <rect x="360" y="18" width="112" height="22" rx="6" fill="#eff6ff"/>
    <text x="416" y="33" text-anchor="middle" fill="#2563eb" font-size="11" font-weight="600">内存 · 屏幕展示</text>

    <text x="64" y="60" fill="#475569" font-size="12">代码：activeResources.get(key)</text>
    <text x="64" y="80" fill="#64748b" font-size="11">原理：Map&lt;Key, ResourceWeakReference&gt; 弱引用容器</text>
    <text x="64" y="100" fill="#64748b" font-size="11">目的：正在屏幕展示的图片由其持有，不参与 LRU 统计，防被误删</text>

    <!-- 命中分支线与卡片 -->
    <path d="M 530 66 L 590 66" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-hit)"/>
    <rect x="592" y="16" width="288" height="100" rx="12" fill="url(#hit-grad)" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="606" y="28" width="46" height="20" rx="4" fill="#10b981"/>
    <text x="629" y="42" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">HIT 命中</text>
    <text x="660" y="42" fill="#065f46" font-size="13" font-weight="700">引用计数加一</text>
    <text x="606" y="68" fill="#047857" font-size="12">执行 activeResource.acquire()</text>
    <text x="606" y="88" fill="#047857" font-size="11">直接把已解码的 Bitmap 回调给 View 上屏</text>
  </g>

  <!-- 连线：第1级 -> 第2级 -->
  <path d="M 285 360 L 285 400" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-miss)"/>
  <rect x="253" y="370" width="64" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="285" y="384" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">未命中 MISS</text>

  <!-- ================= 第二级：MemoryCache ================= -->
  <g transform="translate(40, 402)">
    <rect width="490" height="136" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="136" rx="4" fill="#22c55e"/>
    
    <circle cx="36" cy="36" r="16" fill="#f0fdf4"/>
    <text x="36" y="42" text-anchor="middle" fill="#16a34a" font-size="15" font-weight="700">2</text>
    
    <text x="64" y="32" fill="#0f172a" font-size="15" font-weight="700">检查 MemoryCache (内存缓存 · LRU 强引用)</text>
    <rect x="372" y="18" width="100" height="22" rx="6" fill="#f0fdf4"/>
    <text x="422" y="33" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="600">内存 · 闲置备用</text>

    <text x="64" y="60" fill="#475569" font-size="12">代码：memoryCache.remove(key) (⚠️ 命中即移出)</text>
    <text x="64" y="80" fill="#64748b" font-size="11">原理：LruResourceCache 强引用，按最近最少使用淘汰</text>
    <text x="64" y="100" fill="#64748b" font-size="11">互斥：离开屏幕在 MemoryCache；重回屏幕移入 ActiveResources</text>

    <!-- 命中分支线与卡片 -->
    <path d="M 530 68 L 590 68" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-hit)"/>
    <rect x="592" y="16" width="288" height="104" rx="12" fill="url(#hit-grad)" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="606" y="28" width="46" height="20" rx="4" fill="#10b981"/>
    <text x="629" y="42" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">HIT 命中</text>
    <text x="660" y="42" fill="#065f46" font-size="13" font-weight="700">从 LRU 转移到 Active</text>
    <text x="606" y="66" fill="#047857" font-size="11">① 从 memoryCache 移除 (remove)</text>
    <text x="606" y="82" fill="#047857" font-size="11">② activeResources.activate(key, res) 转入活动表</text>
    <text x="606" y="98" fill="#047857" font-size="11">③ acquired=1 递增并返回展示</text>
  </g>

  <!-- 连线：第2级 -> 第3级 (开启异步线程) -->
  <path d="M 285 538 L 285 608" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-miss)"/>
  <rect x="185" y="558" width="200" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="285" y="572" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">内存全未命中 · 开启后台异步加载</text>
  <text x="285" y="584" text-anchor="middle" fill="#64748b" font-size="9">构造 EngineJob + DecodeJob 状态机</text>

  <!-- ================= 第三级：DiskCache RESOURCE ================= -->
  <g transform="translate(40, 610)">
    <rect width="490" height="132" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="132" rx="4" fill="#8b5cf6"/>
    
    <circle cx="36" cy="36" r="16" fill="#f5f3ff"/>
    <text x="36" y="42" text-anchor="middle" fill="#7c3aed" font-size="15" font-weight="700">3</text>
    
    <text x="64" y="32" fill="#0f172a" font-size="15" font-weight="700">检查 RESOURCE 磁盘缓存 (变换后资源)</text>
    <rect x="360" y="18" width="112" height="22" rx="6" fill="#f5f3ff"/>
    <text x="416" y="33" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">磁盘 · 裁剪变换图</text>

    <text x="64" y="60" fill="#475569" font-size="12">代码：diskCache.get(ResourceCacheKey)</text>
    <text x="64" y="80" fill="#64748b" font-size="11">原理：已按当前 View 目标尺寸 Downsample 裁剪与变换的文件</text>
    <text x="64" y="100" fill="#64748b" font-size="11">优势：读取直接解码为 Bitmap，无额外计算，CPU 开销最低</text>

    <!-- 命中分支线与卡片 -->
    <path d="M 530 66 L 590 66" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-hit)"/>
    <rect x="592" y="16" width="288" height="100" rx="12" fill="url(#hit-grad)" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="606" y="28" width="46" height="20" rx="4" fill="#10b981"/>
    <text x="629" y="42" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">HIT 命中</text>
    <text x="660" y="42" fill="#065f46" font-size="13" font-weight="700">极速反序列化</text>
    <text x="606" y="68" fill="#047857" font-size="11">从本地文件读取已裁切好的数据</text>
    <text x="606" y="88" fill="#047857" font-size="11">解码上屏，并注册进 ActiveResources</text>
  </g>

  <!-- 连线：第3级 -> 第4级 -->
  <path d="M 285 742 L 285 782" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-miss)"/>
  <rect x="253" y="752" width="64" height="20" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="285" y="766" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="600">未命中 MISS</text>

  <!-- ================= 第四级：DiskCache DATA ================= -->
  <g transform="translate(40, 784)">
    <rect width="490" height="132" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="8" height="132" rx="4" fill="#f97316"/>
    
    <circle cx="36" cy="36" r="16" fill="#fff7ed"/>
    <text x="36" y="42" text-anchor="middle" fill="#ea580c" font-size="15" font-weight="700">4</text>
    
    <text x="64" y="32" fill="#0f172a" font-size="15" font-weight="700">检查 DATA 磁盘缓存 (原始数据流)</text>
    <rect x="372" y="18" width="100" height="22" rx="6" fill="#fff7ed"/>
    <text x="422" y="33" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="600">磁盘 · 原始数据流</text>

    <text x="64" y="60" fill="#475569" font-size="12">代码：diskCache.get(DataCacheKey)</text>
    <text x="64" y="80" fill="#64748b" font-size="11">原理：网络下载未做任何修改的原图流文件 (InputStream)</text>
    <text x="64" y="100" fill="#64748b" font-size="11">优势：同一原图不同尺寸展示时直接复用，免去耗流量重下</text>

    <!-- 命中分支线与卡片 -->
    <path d="M 530 66 L 590 66" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-hit)"/>
    <rect x="592" y="16" width="288" height="100" rx="12" fill="url(#hit-grad)" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect x="606" y="28" width="46" height="20" rx="4" fill="#10b981"/>
    <text x="629" y="42" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">HIT 命中</text>
    <text x="660" y="42" fill="#065f46" font-size="13" font-weight="700">本地重采样解码</text>
    <text x="606" y="68" fill="#047857" font-size="11">读取原图流，按当前 View 尺寸解码裁剪</text>
    <text x="606" y="88" fill="#047857" font-size="11">⚡ 零网络请求，极速渲染并写入 Active</text>
  </g>

  <!-- 连线：第4级 -> 第5级 (网络回退) -->
  <path d="M 285 916 L 285 966" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-miss)"/>
  <rect x="240" y="930" width="90" height="20" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="285" y="944" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="600">四级全空 ALL MISS</text>

  <!-- ================= 第五级：Source / Network ================= -->
  <g transform="translate(40, 968)">
    <rect width="840" height="142" rx="14" fill="url(#net-grad)" stroke="#fcd34d" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <circle cx="36" cy="38" r="16" fill="#fef3c7"/>
    <text x="36" y="44" text-anchor="middle" fill="#d97706" font-size="15" font-weight="700">5</text>
    
    <text x="64" y="34" fill="#92400e" font-size="16" font-weight="700">最终回退：SourceGenerator (网络请求 / 外部数据源)</text>
    <rect x="690" y="20" width="126" height="24" rx="6" fill="#fde68a"/>
    <text x="753" y="36" text-anchor="middle" fill="#b45309" font-size="11" font-weight="700">HTTP / NETWORK</text>

    <text x="64" y="66" fill="#b45309" font-size="13">调用 HttpUrlFetcher (或配置的 OkHttp) 发起真实的远程网络请求</text>

    <!-- 三步流转胶囊 -->
    <g transform="translate(64, 80)">
      <rect width="210" height="42" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="18" fill="#78350f" font-size="11" font-weight="700">步骤 ① 写入磁盘</text>
      <text x="14" y="33" fill="#92400e" font-size="10">原图流存入 DATA 磁盘缓存</text>
    </g>

    <g transform="translate(290, 80)">
      <rect width="220" height="42" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="18" fill="#78350f" font-size="11" font-weight="700">步骤 ② 采样解码</text>
      <text x="14" y="33" fill="#92400e" font-size="10">按 View 宽高尺寸裁剪转换 Bitmap</text>
    </g>

    <g transform="translate(526, 80)">
      <rect width="240" height="42" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="18" fill="#78350f" font-size="11" font-weight="700">步骤 ③ 登记活动资源</text>
      <text x="14" y="33" fill="#92400e" font-size="10">登记至 ActiveResources 并回调上屏</text>
    </g>
  </g>

  <!-- 底部汇总注脚 -->
  <g transform="translate(40, 1130)">
    <rect width="840" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="27" text-anchor="middle" fill="#64748b" font-size="11">
      💡 核心闭环：当图片离开屏幕时，触发 engineResource.release() 计数归零，自动从 ActiveResources 注销并转入 MemoryCache (LRU) 待命
    </text>
  </g>
</svg>
