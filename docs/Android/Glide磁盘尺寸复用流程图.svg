<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="d-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="d-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="d-arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="40" y="38" fill="#0f172a" font-size="17" font-weight="700">两级磁盘缓存：为什么有了裁剪图还需要原始原图？</text>
  <text x="40" y="58" fill="#64748b" font-size="11">RESOURCE 保证最高渲染性能 · DATA 保证跨尺寸展示时零网络流量开销</text>

  <!-- 场景 1：列表页首次加载 (小图) -->
  <g transform="translate(40, 80)">
    <rect width="400" height="280" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#d-shadow)"/>
    <rect x="0" y="0" width="400" height="42" rx="14" fill="#f5f3ff"/>
    <rect x="0" y="28" width="400" height="14" fill="#f5f3ff"/>
    <text x="200" y="26" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="700">场景 ①：商品列表页 (请求 100×100 小图)</text>
    
    <!-- 步骤卡片流 -->
    <g transform="translate(20, 56)">
      <rect width="360" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="26" r="12" fill="#8b5cf6"/>
      <text x="26" y="30" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
      <text x="48" y="22" fill="#0f172a" font-size="12" font-weight="600">首次下载：获取 1000×1000 完整网络原图流</text>
      <text x="48" y="38" fill="#64748b" font-size="10">通过 HttpUrlFetcher 从服务端完整下载原始数据字节</text>

      <path d="M 180 52 L 180 72" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#d-arrow-blue)"/>

      <rect y="74" width="360" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <circle cx="26" cy="102" r="12" fill="#f97316"/>
      <text x="26" y="106" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text>
      <text x="48" y="98" fill="#9a3412" font-size="12" font-weight="700">落盘 DATA 磁盘缓存：保存原图 (1000×1000)</text>
      <text x="48" y="116" fill="#c2410c" font-size="10">未做任何缩放修改，完整原汁原味保存在磁盘中</text>

      <path d="M 180 130 L 180 150" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#d-arrow-blue)"/>

      <rect y="152" width="360" height="56" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <circle cx="26" cy="180" r="12" fill="#7c3aed"/>
      <text x="26" y="184" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text>
      <text x="48" y="176" fill="#5b21b6" font-size="12" font-weight="700">裁切并落盘 RESOURCE 缓存：生成 100×100</text>
      <text x="48" y="194" fill="#6d28d9" font-size="10">针对列表页 ImageView 尺寸采样裁切，立即上屏渲染</text>
    </g>
  </g>

  <!-- 场景 2：详情页二次加载 (大图) -->
  <g transform="translate(480, 80)">
    <rect width="400" height="280" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#d-shadow)"/>
    <rect x="0" y="0" width="400" height="42" rx="14" fill="#f0fdf4"/>
    <rect x="0" y="28" width="400" height="14" fill="#f0fdf4"/>
    <text x="200" y="26" text-anchor="middle" fill="#15803d" font-size="13" font-weight="700">场景 ②：商品详情页 (请求 800×800 大图)</text>
    
    <g transform="translate(20, 56)">
      <rect width="360" height="52" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <circle cx="26" cy="26" r="12" fill="#ef4444"/>
      <text x="26" y="30" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">✕</text>
      <text x="48" y="22" fill="#991b1b" font-size="12" font-weight="600">查 RESOURCE 磁盘缓存：未命中 (MISS)</text>
      <text x="48" y="38" fill="#b91c1c" font-size="10">磁盘中只有 100×100 的裁切图，不能拉伸给 800×800 用</text>

      <path d="M 180 52 L 180 72" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#d-arrow-green)"/>

      <rect y="74" width="360" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="26" cy="102" r="12" fill="#10b981"/>
      <text x="26" y="106" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">✓</text>
      <text x="48" y="98" fill="#065f46" font-size="12" font-weight="700">查 DATA 磁盘缓存：成功命中！(HIT)</text>
      <text x="48" y="116" fill="#047857" font-size="10">本地磁盘找到了场景 ① 保存的 1000×1000 原图！</text>

      <path d="M 180 130 L 180 150" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#d-arrow-green)"/>

      <rect y="152" width="360" height="56" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="26" cy="180" r="12" fill="#059669"/>
      <text x="26" y="184" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">⚡</text>
      <text x="48" y="176" fill="#065f46" font-size="12" font-weight="700">本地直接重新解码 800×800，零网络开销！</text>
      <text x="48" y="194" fill="#047857" font-size="10">无需重新请求网络，省下巨大流量且几乎瞬间打开！</text>
    </g>
  </g>

  <!-- 底部对比结论 -->
  <g transform="translate(40, 386)">
    <rect width="840" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="420" y="24" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">
      🎯 结论：RESOURCE 用磁盘换极致 CPU 解码速度；DATA 用磁盘换极端节约用户流量。
    </text>
    <text x="420" y="40" text-anchor="middle" fill="#64748b" font-size="11">
      两者配合，兼顾了“滑动顺滑度”与“跨界面复用率”。
    </text>
  </g>
</svg>
