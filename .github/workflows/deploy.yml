name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # VitePress lastUpdated 依赖 git 历史获取文章最后修改时间

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit to IndexNow
        if: success()
        continue-on-error: true
        run: |
          curl -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "endlessyoung.github.io",
              "key": "208c12af10454a61a4ef6e0fcd59aec0",
              "keyLocation": "https://endlessyoung.github.io/Blog_/208c12af10454a61a4ef6e0fcd59aec0.txt",
              "urlList": ["https://endlessyoung.github.io/Blog_/"]
            }'

      - name: Submit Sitemap to Bing
        if: success()
        continue-on-error: true
        run: |
          curl -X GET "https://www.bing.com/ping?sitemap=https://endlessyoung.github.io/Blog_/sitemap.xml" \
            || echo "Bing ping skipped (may be deprecated)"
