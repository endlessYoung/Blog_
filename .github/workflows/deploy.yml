name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # VitePress lastUpdated 依赖 git 历史获取文章最后修改时间

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  seo:
    timeout-minutes: 5
    needs: deploy
    runs-on: ubuntu-latest
    name: Notify search engines
    steps:
      - name: Submit to IndexNow
        run: |
          python3 << 'PY'
          import json, time, urllib.error, urllib.request, xml.etree.ElementTree as ET

          key = "208c12af10454a61a4ef6e0fcd59aec0"
          host = "endlessyoung.top"
          key_url = f"https://{host}/{key}.txt"
          sitemap = f"https://{host}/sitemap.xml"

          ready = False
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(key_url, timeout=20) as response:
                      body = response.read().decode().strip()
                  if response.status == 200 and body == key:
                      ready = True
                      break
                  print(f"key file not ready ({response.status}): {body[:80]!r}")
              except Exception as error:
                  print(f"key file not ready: {error}")
              time.sleep(5)
          if not ready:
              raise SystemExit(f"IndexNow key is not published at {key_url}")

          with urllib.request.urlopen(sitemap, timeout=30) as response:
              root = ET.fromstring(response.read())
          locs = [
              node.text.strip()
              for node in root.iter("{http://www.sitemaps.org/schemas/sitemap/0.9}loc")
              if node.text and node.text.strip().startswith(f"https://{host}/")
          ]
          if not locs:
              locs = [f"https://{host}/"]
          print(f"submitting {len(locs)} urls")

          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": key_url,
              "urlList": locs,
          }).encode()
          request = urllib.request.Request(
              "https://www.bing.com/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print(response.status, response.read().decode()[:500])
          except urllib.error.HTTPError as error:
              detail = error.read().decode()[:500]
              print(error.code, detail)
              raise SystemExit(f"IndexNow rejected the submission: {error.code} {detail}")
          PY

      - name: Submit Sitemap to Bing
        continue-on-error: true
        run: |
          curl -sS --connect-timeout 10 --max-time 30 \
            "https://www.bing.com/ping?sitemap=https://endlessyoung.top/sitemap.xml" \
            || echo "Bing ping skipped"

      - name: Submit to Baidu active push
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "${BAIDU_PUSH_TOKEN}" ]; then
            echo "BAIDU_PUSH_TOKEN not set, skipping Baidu push"
            exit 0
          fi
          # Collect URLs from the sitemap (fallback to homepage)
          curl -sS --connect-timeout 10 --max-time 30 \
            "https://endlessyoung.top/sitemap.xml" -o sitemap.xml || true
          if [ -s sitemap.xml ]; then
            sed -n 's:.*<loc>\([^<]*\)</loc>.*:\1:p' sitemap.xml | head -n 10 > urls.txt
          else
            echo "https://endlessyoung.top/" > urls.txt
          fi
          echo "Submitting $(wc -l < urls.txt) URLs to Baidu"
          curl -sS --connect-timeout 10 --max-time 60 \
            -H "Content-Type: text/plain" \
            --data-binary @urls.txt \
            "http://data.zz.baidu.com/urls?site=https://endlessyoung.top&token=${BAIDU_PUSH_TOKEN}" \
            || echo "Baidu push skipped"
