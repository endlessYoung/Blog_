name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # VitePress lastUpdated 依赖 git 历史获取文章最后修改时间

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  seo:
    timeout-minutes: 2
    needs: deploy
    runs-on: ubuntu-latest
    name: Notify search engines
    steps:
      - name: Submit to IndexNow
        continue-on-error: true
        run: |
          curl -sS --connect-timeout 10 --max-time 30 \
            -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "endlessyoung.github.io",
              "key": "208c12af10454a61a4ef6e0fcd59aec0",
              "keyLocation": "https://endlessyoung.github.io/Blog_/208c12af10454a61a4ef6e0fcd59aec0.txt",
              "urlList": ["https://endlessyoung.github.io/Blog_/"]
            }'

      - name: Submit Sitemap to Bing
        continue-on-error: true
        run: |
          curl -sS --connect-timeout 10 --max-time 30 \
            "https://www.bing.com/ping?sitemap=https://endlessyoung.github.io/Blog_/sitemap.xml" \
            || echo "Bing ping skipped"

      - name: Submit to Baidu active push
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "${BAIDU_PUSH_TOKEN}" ]; then
            echo "BAIDU_PUSH_TOKEN not set, skipping Baidu push"
            exit 0
          fi
          # Collect URLs from the sitemap (fallback to homepage)
          curl -sS --connect-timeout 10 --max-time 30 \
            "https://endlessyoung.github.io/Blog_/sitemap.xml" -o sitemap.xml || true
          if [ -s sitemap.xml ]; then
            sed -n 's:.*<loc>\([^<]*\)</loc>.*:\1:p' sitemap.xml > urls.txt
          else
            echo "https://endlessyoung.github.io/Blog_/" > urls.txt
          fi
          echo "Submitting $(wc -l < urls.txt) URLs to Baidu"
          curl -sS --connect-timeout 10 --max-time 60 \
            -H "Content-Type: text/plain" \
            --data-binary @urls.txt \
            "https://data.zz.baidu.com/urls?site=endlessyoung.github.io&token=${BAIDU_PUSH_TOKEN}" \
            || echo "Baidu push skipped"
